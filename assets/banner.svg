<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="pipeline-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulse-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace; }
    .heading-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Dynamic Pipeline Animation */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes dash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes particle-flow {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes orbit-glow {
      0% { transform: rotate(0deg) translateX(120px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
    }

    .pipeline-line {
      stroke-dasharray: 8 12;
      animation: dash 12s linear infinite;
    }
    .orb-glow-1 {
      animation: pulse 6s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-glow-2 {
      animation: pulse 8s ease-in-out infinite 2s;
      transform-origin: center;
    }
    .floating-card-1 {
      animation: float-badge 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float-badge 6s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: float-badge 5.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#cyber-grid)"/>

  <!-- Glowing Orbs (Dynamic Ambient Lighting in background) -->
  <circle class="orb-glow-1" cx="200" cy="100" r="180" fill="url(#glow-grad)"/>
  <circle class="orb-glow-2" cx="1000" cy="300" r="220" fill="url(#glow-grad)"/>
  <circle cx="600" cy="210" r="280" fill="#4f46e5" fill-opacity="0.06" filter="url(#glow-blur)"/>

  <!-- Visual Pipeline Track (Dynamic in Background/Midground) -->
  <g opacity="0.45">
    <path class="pipeline-line" d="M 80,350 C 300,350 400,380 600,380 C 800,380 900,340 1120,340" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="pipeline-line" d="M 80,70 C 300,70 450,40 600,40 C 850,40 950,80 1120,80" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Dynamic Pipeline Stages Badges / Floating Elements (Behind text, around borders) -->
  <!-- Left-lower floating badge: BUILD -->
  <g class="floating-card-1" transform="translate(60, 240)">
    <rect width="120" height="42" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="22" cy="21" r="5" fill="#38bdf8" filter="url(#pulse-glow)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="600" class="code-text">BUILD ⚙️</text>
  </g>

  <!-- Right-upper floating badge: TEST -->
  <g class="floating-card-2" transform="translate(1010, 80)">
    <rect width="125" height="42" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="22" cy="21" r="5" fill="#818cf8" filter="url(#pulse-glow)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="600" class="code-text">TEST ✔️</text>
  </g>

  <!-- Right-lower floating badge: DEPLOY -->
  <g class="floating-card-3" transform="translate(1010, 260)">
    <rect width="135" height="42" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
    <circle cx="22" cy="21" r="5" fill="#10b981" filter="url(#pulse-glow)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="600" class="code-text">DEPLOY 🚀</text>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Feature Pills (Always strictly in foreground) -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Top Pill / Category -->
    <rect x="-180" y="-30" width="360" height="34" rx="17" fill="#1e293b" fill-opacity="0.95" stroke="#475569" stroke-width="1"/>
    <text x="0" y="-8" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5" class="code-text">⚡ CURATED DEVOPS &amp; CI/CD TOOLKIT</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="url(#title-grad)" font-size="44" class="heading-text" letter-spacing="-0.5">
      Awesome Continuous Integration &amp; Deployment
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" fill="#94a3b8" font-size="18" class="body-text" font-weight="400">
      The definitive index of SaaS Platforms, GitOps Controllers, Self-Hosted Runners &amp; Pipeline Engines
    </text>

    <!-- Feature Pills row in foreground -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: GitHub Actions & GitLab -->
      <g transform="translate(-320, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="600" class="code-text">🐙 SaaS Leaders</text>
      </g>

      <!-- Pill 2: GitOps & Kubernetes -->
      <g transform="translate(-105, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="600" class="code-text">☸️ GitOps Delivery</text>
      </g>

      <!-- Pill 3: Self-Hosted CI -->
      <g transform="translate(115, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="600" class="code-text">🛠️ Self-Hosted CI</text>
      </g>

      <!-- Pill 4: Production Tested -->
      <g transform="translate(325, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="600" class="code-text">🌟 100% Star-Ranked</text>
      </g>
    </g>

    <!-- Bottom Metrics Pill -->
    <g transform="translate(0, 220)">
      <text x="0" y="0" fill="#64748b" font-size="12" class="code-text">
        Updated November 2026 • Verified Pricing &amp; Open-Source Metrics • Community-Driven
      </text>
    </g>
  </g>
</svg>
